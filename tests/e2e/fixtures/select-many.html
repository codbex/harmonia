<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>select many fixture</title>
    <link rel="stylesheet" href="/dist/harmonia.css" />
    <script>
      // Every refresh of the trigger label writes aria-selected on every option,
      // so these records divided by the option count are the number of
      // refreshes. Installed before Alpine starts, so the mount is counted too.
      window.ariaSelectedWrites = 0;
      new MutationObserver((records) => {
        window.ariaSelectedWrites += records.length;
      }).observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ["aria-selected"] });
    </script>
    <script src="/dist/harmonia.js"></script>
    <script src="/node_modules/alpinejs/dist/cdn.min.js" defer></script>
  </head>
  <body x-data class="bg-background p-4 text-foreground">
    <div id="many" x-data="{ value: '42', options: Array.from({ length: 1400 }, (_, i) => ({ value: String(i + 1), text: 'Customer ' + (i + 1) })) }" class="w-3xs">
      <div id="many-select" x-h-select>
        <input x-h-select-input x-model="value" placeholder="Select" aria-label="Customer" />
        <div x-h-select-content>
          <div x-h-select-list>
            <template x-for="opt in options" :key="opt.value">
              <div x-h-select-option="opt.text" :data-value="opt.value"></div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
