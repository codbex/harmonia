<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>split gutterless fixture</title>
    <link rel="stylesheet" href="/dist/harmonia.css" />
    <script src="/dist/harmonia.js"></script>
    <script src="/node_modules/alpinejs/dist/cdn.min.js" defer></script>
  </head>
  <body x-data class="bg-background p-4 text-foreground">
    <div style="width: 80vw; height: 12rem">
      <div id="split" class="size-full" x-h-split data-orientation="horizontal" data-variant="handle">
        <div id="fixed" class="border" x-h-split-panel data-gutterless="true" data-size="200">
          <div class="flex size-full items-center justify-center overflow-hidden">Fixed</div>
        </div>
        <div id="panel-a" class="border" x-h-split-panel>
          <div class="flex size-full items-center justify-center overflow-hidden">A</div>
        </div>
        <div id="panel-b" class="border" x-h-split-panel>
          <div class="flex size-full items-center justify-center overflow-hidden">B</div>
        </div>
      </div>
    </div>
  </body>
</html>
