name: Close AI-generated pull requests

# pull_request_target gives fork pull requests a token that can close them. It is safe here because nothing from the pull request is checked out or executed.
on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest

    steps:
      - name: Close when the description carries an AI tool signature
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          SIGNATURES='generated (with|by|using) \[?(claude|codex|copilot|cursor|devin|aider|gemini|jules|windsurf)|co-authored-by: *(claude|copilot|cursor|aider|codex|gemini)|noreply@anthropic\.com|chatgpt\.com/codex|app\.devin\.ai'
          if ! printf '%s' "$PR_BODY" | grep -qiE "$SIGNATURES"; then
            echo "No AI tool signature found."
            exit 0
          fi
          MESSAGE="This pull request was closed automatically because it was generated by an AI. Our contributing rules ask every author to create their own pull requests. See the [AI coding assistants]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/CONTRIBUTING.md#ai-coding-assistants) section of CONTRIBUTING.md. You are welcome to open a new pull request that you wrote yourself."
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$MESSAGE"
