<div class="mx-auto vbox w-full max-w-3xl gap-6 px-6 py-8" x-data="docPage">
  <h1 x-h-text.h1>Blog</h1>
  <p x-h-text.lead>Release notes and the occasional note about why the cache behaves the way it does.</p>

  <div class="vbox divide-y">
    <template x-for="post in $store.quartz.posts" :key="post.route">
      <article class="vbox gap-2 py-6">
        <div class="hbox items-center gap-2">
          <time class="text-sm text-muted-foreground" x-h-date-format="post.date" data-options='{ "dateStyle": "long" }'></time>
          <span x-h-badge data-variant="outline" x-text="post.tag"></span>
        </div>
        <!-- A real anchor on purpose: Pinecone Router intercepts plain-path links. -->
        <h2 x-h-text.h4>
          <a class="no-underline" :href="post.route" x-text="post.title"></a>
        </h2>
        <p class="text-muted-foreground" x-text="post.excerpt"></p>
        <div class="hbox items-center gap-2 pt-2">
          <div x-h-avatar class="size-6! text-xs" aria-hidden="true" x-text="post.initials"></div>
          <span class="text-sm text-muted-foreground" x-text="post.author"></span>
        </div>
      </article>
    </template>
  </div>

  <!-- The pager markup lives once in index.html; see the pager template there. -->
  <template x-h-template="$refs.pager" x-data></template>
</div>
